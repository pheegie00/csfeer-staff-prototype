
{{- if .Values.pythonShell.enabled }}
---
# Service account for Python Shell
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "csfeer.fullname" . }}-python-shell
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csfeer.labels" . | nindent 4 }}
    app.kubernetes.io/component: python-shell
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "csfeer.fullname" . }}-python-shell
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csfeer.labels" . | nindent 4 }}
    app.kubernetes.io/component: python-shell
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
rules:
- apiGroups: [""]
  resources: ["pods", "configmaps"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["ssl-certs"]
  verbs: ["get"]

---
# Python Shell RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "csfeer.fullname" . }}-python-shell
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csfeer.labels" . | nindent 4 }}
    app.kubernetes.io/component: python-shell
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0" 
subjects:
- kind: ServiceAccount
  name: {{ include "csfeer.fullname" . }}-python-shell
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "csfeer.fullname" . }}-python-shell
  apiGroup: rbac.authorization.k8s.io


{{- end }}