{{- if and .Values.rbac.create .Values.dbMigrateJob.enabled }}

# Service account for database migration jobs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "csfeer.fullname" . }}-db-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csfeer.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migration
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.dbMigrateJob.serviceAccount.roleArn | quote }}
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false

# DB Migration Role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "csfeer.fullname" . }}-db-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csfeer.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
rules:
- apiGroups: [""]
  resources: ["pods", "configmaps"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["ssl-certs", "app-secrets"]
  verbs: ["get"]

---
# DB Migration RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "csfeer.fullname" . }}-db-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "csfeer.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
subjects:
- kind: ServiceAccount
  name: {{ include "csfeer.fullname" . }}-db-migrate
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "csfeer.fullname" . }}-db-migrate
  apiGroup: rbac.authorization.k8s.io

{{- end }}