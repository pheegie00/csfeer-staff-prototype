{{- if .Values.mockImage.deploy -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "csfeer.fullname" . }}-mock-apis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "csfeer.fullname" . }}-mock-apis
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    helm.sh/chart: {{ include "csfeer.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  replicas: {{ .Values.mockImage.replicaCount }}
  revisionHistoryLimit: 1 # Keep at least 1 revisions of the deployment
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "csfeer.fullname" . }}-mock-apis
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "csfeer.fullname" . }}-mock-apis
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      serviceAccountName: {{ include "csfeer.fullname" . }}-mock-apis
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-external-api
          image: "{{ .Values.mockImage.repository }}:{{ .Values.mockImage.tag }}"
          imagePullPolicy: {{ .Values.mockImage.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          resources:
            {{- toYaml .Values.mockImage.resources | default dict | nindent 12 }}
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
{{- end }} 