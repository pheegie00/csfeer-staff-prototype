services:
  
  mock-oauth:
    extends:
      file: ./docker-compose-base.yml
      service: mock-oauth
    volumes:
      - containers:/var/lib/containers
  oauth-setup:
    extends:
      file: ./docker-compose-base.yml
      service: oauth-setup
    volumes:
      - containers:/var/lib/containers
  db:
    extends:
      file: ./docker-compose-base.yml
      service: db
    volumes:
      - containers:/var/lib/containers

  app:
    image: "${FULL_IMAGE_NAME}"
    extends:
      file: ./docker-compose-base.yml
      service: app
    volumes:
      - containers:/var/lib/containers

  e2e:
    extends:
      file: ./docker-compose-base.yml
      service: e2e
    volumes:
      - containers:/var/lib/containers

volumes:
  pgdata:
  containers:
