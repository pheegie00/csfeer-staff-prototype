services:
  
  mock-oauth:
    extends:
      file: ./docker-compose-base.yml
      service: mock-oauth
    environment:
      SETUP_DELAY: ${KC_SETUP_DELAY:-20}
    post_start:
      - command: bash -c "bash /opt/keycloak/setup-keycloak.sh | tee /proc/1/fd/1"

  db:
    extends:
      file: ./docker-compose-base.yml
      service: db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydatabase"]
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    environment:
      DB_CONFIG__pgdatabase: csfeer_e2e_test
      DB_CONFIG__test_pgdatabase: csfeer_e2e_test
      APP_CONFIG__allowed_hosts: "['*']"
      PLAYWRIGHT_TIMEOUT: 60000
      PLAYWRIGHT_NAVIGATION_TIMEOUT: 60000
    image: "${IMAGE_NAME}"
    extends:
      file: ./docker-compose-base.yml
      service: app
    volumes:
      - ../../tests/:/app/tests/

volumes:
  pgdata:
