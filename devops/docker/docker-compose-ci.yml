services:
  
  mock-oauth:
    extends:
      file: ./docker-compose-base.yml
      service: mock-oauth
    environment:
      SETUP_DELAY: 20
  db:
    extends:
      file: ./docker-compose-base.yml
      service: db

  app:
    environment:
      DB_CONFIG__pgdatabase: csfeer_e2e_test
      DB_CONFIG__test_pgdatabase: csfeer_e2e_test
      APP_CONFIG__allowed_hosts: "['*']"
      PLAYWRIGHT_TIMEOUT: 60000
      PLAYWRIGHT_NAVIGATION_TIMEOUT: 60000
    image: "${IMAGE_NAME}"
    extends:
      file: ./docker-compose-base.yml
      service: app
    volumes:
      - ../../tests:/app/tests/     
  
  e2e:
    image: "${IMAGE_NAME}"
    extends:
      file: ./docker-compose-base.yml
      service: e2e

volumes:
  pgdata:
