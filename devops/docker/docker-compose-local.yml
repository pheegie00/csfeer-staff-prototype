services:
  
  mock-oauth:
    extends:
      file: ./docker-compose-base.yml
      service: mock-oauth
  db:
    extends:
      file: ./docker-compose-base.yml
      service: db

  storage:
    extends:
      file: ./docker-compose-base.yml
      service: storage

  app:
    build:
      target: dev
      context: ../..
    extends:
      file: ./docker-compose-base.yml
      service: app
    environment:
      - SHOW_APP_VERSION=True
      - OIDC_CONFIG__document_url=${CUSTOM_OIDC_DOCUMENT_URL:-http://oauth.csfeer:8081/realms/csfeer/.well-known/openid-configuration}
      - OIDC_CONFIG__client_id=${CUSTOM_OIDC_CLIENT_ID:-csfeer-auth}
      - OIDC_CONFIG__client_secret=${CUSTOM_OIDC_CLIENT_SECRET:-shhhhhhhh}
    post_start:
      - command: >
          /bin/bash -c "
          uv run python manage.py migrate --noinput &&
          uv run manage.py seed_test_users &&
          uv run manage.py load_initial_forms
          "
    volumes:
      - ../../csfeer/:/app/csfeer/
      - ../../form_manager/:/app/form_manager/
      - ../../frontend/built/:/app/csfeer/static/frontend/
      - ../../tests:/app/tests/
      - ../../core:/app/core/
      - ../../users:/app/users/
      - ../../organizations:/app/organizations/
      - ../../logs/:/app/logs/
      - ../../.coverage_report/:/app/.coverage_report/

volumes:
  pgdata:
  storage:

