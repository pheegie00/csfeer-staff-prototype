services:
  
  mock-oauth:
    image: quay.io/keycloak/keycloak:latest
    hostname: oauth.csfeer
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/csfeerauth
      KC_DB_USERNAME: csfeer
      KC_DB_PASSWORD: secret123
      KC_HTTP_PORT: 8081
      KC_BOOTSTRAP_ADMIN_CLIENT_ID: csfeer-auth
      KC_BOOTSTRAP_ADMIN_CLIENT_SECRET: shhhhhhhh
      USERS_CSV: /opt/keycloak/users.csv
    command: start-dev
    # healthcheck:
    #   test: ["CMD-SHELL", "cat /opt/keycloak/setup-complete"]
    #   interval: 1s
    #   retries: 100
    volumes:
      - ../../devops/mocks/keycloak:/opt/keycloak/data/import
      - ../../devops/mocks/keycloak/users.csv:/opt/keycloak/users.csv:ro
      - ../../devops/mocks/keycloak/setup-keycloak.sh:/opt/keycloak/setup-keycloak.sh:ro
    # post_start:
    #   - command: bash -c "bash /opt/keycloak/setup-keycloak.sh"
    depends_on:
      - db
    ports:
      - "127.0.0.1:8081:8081"
    cap_drop:
      - all
    security_opt:
      - "no-new-privileges:true"
    networks:
      default:
        aliases:
          - oauth.csfeer
  db:
    image: postgres:16
    healthcheck:
      test: "/bin/true"
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: secret123
      POSTGRES_USER: csfeer
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../devops/postgresql/initdb.d:/docker-entrypoint-initdb.d
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
      - SYS_CHROOT
      - SETGID
      - SETFCAP
      - SETPCAP
      - SETUID
    cap_drop:
      - all
    networks:
      default:
        aliases:
          - db.csfeer
    hostname: db.csfeer

  storage:
    image: rustfs/rustfs:latest-glibc
    ports:
      - 9000:9000
      - 9001:9001
      - 7001:7001
    volumes:
      - storage:/data
      - ../../devops/mocks/rustfs/create-buckets.sh:/create-buckets.sh:ro
    hostname: storage.csfeer
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: admin
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_SERVER_DOMAINS: "storage.csfeer"
      BUCKET_TO_CREATE: core-local
      IAM_KEY_TO_CREATE: alfq80VW6dJW4sYxDaam
      IAM_SECRET_TO_CREATE: KA8dxUCwYDHm2JSgDKZvezRDeIVGT2RX3ITjP55F
    post_start:
      - command: sh /create-buckets.sh
  
  app:
    environment:
      DJANGO_ALLOW_ASYNC_UNSAFE: true
      BASE_URL: http://ui.csfeer:8000
      OIDC_CONFIG__CLIENT_SECRET: shhhhhhhh
      OIDC_CONFIG__USE_PKCE: False
      DB_CONFIG__SSL_MODE: disable
      OIDC_CONFIG__CLIENT_ID: csfeer-auth
      OIDC_CONFIG__DOCUMENT_URL: http://oauth.csfeer:8081/realms/csfeer/.well-known/openid-configuration
      DJANGO_SETTINGS_MODULE: csfeer.settings
      DB_CONFIG__PGHOST: db
      ENVIRONMENT: docker
      AWS_ACCESS_KEY_ID: alfq80VW6dJW4sYxDaam
      AWS_SECRET_ACCESS_KEY: KA8dxUCwYDHm2JSgDKZvezRDeIVGT2RX3ITjP55F
      AWS_S3_ENDPOINT_URL: http://storage.csfeer:9000
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "8000:8000"
    healthcheck:
      test: "/bin/true"
    depends_on:
      db:
        condition: service_healthy
      mock-oauth:
        condition: service_started
    cap_drop:
      - all
    hostname: ui.csfeer

volumes:
  pgdata:
  storage:
