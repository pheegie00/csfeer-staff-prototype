[project]
name = "csfeer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Michael Kalish", email = "michael.kalish@focusconsulting.io"},
]
dependencies = [
    "boto3>=1.42.89",
    "django>=6.0.4",
    "django-cotton>=2.6.2",
    "django-crispy-forms>=2.6",
    "django-json-widget>=2.1.1",
    "django-ninja>=1.6.2",
    "django-npm>=1.0.1",
    "django-oauth2-authcodeflow>=1.4.1",
    "django-pattern-library>=1.5.0",
    "gunicorn>=25.3.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "whitenoise>=6.12.0",
    "pydantic[email]>=2.13.0",
    "pydantic_extra_types>=2.11.1",
    "phonenumbers>=9.0.28",
    "semver>=3.0.4",
    "weasyprint>=68.1",
    "django-storages>=1.14.6",
    "django-cotton-uswds>=1.1.2",
    "django-localflavor>=5.0",
]

[dependency-groups]
dev = [
    "gitlint>=0.19.1",
    "pre-commit>=4.5.1",
    "black>=26.3.1",
    "django-extensions>=4.1",
    "ruff>=0.15.10",
    "pydotplus>=2.0.2",
    "types-requests>=2.33.0.20260408",
    "ipdb",
    # testing dependencies
    "freezegun>=1.5.5",
    "playwright>=1.58.0",
    "pyright[nodejs]>=1.1.408",
    "coverage>=7.13.5",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.12.0",
    "pytest-playwright>=0.7.2",
    "pytest>=9.0.3",
    "faker==39.0.0",
    "axe-playwright-python>=0.1.7",
    "django-stubs-ext>=6.0.3",
    "django-types>=0.24.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
exclude = [
    "migrations",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B019", "F403", "UP046"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "csfeer.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--migrations",
    "--reuse-db",  # Reuse test database between runs (faster)
    "-p no:warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
relative_files = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "manage.py",
]

[tool.coverage.report]
show_missing = true

[tool.setuptools]
py-modules = []

