[project]
name = "csfeer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Michael Kalish", email = "michael.kalish@focusconsulting.io"},
]
dependencies = [
    "boto3>=1.40.46",
    "django>=6.0.0",
    "django-cotton>=2.1.3",
    "django-crispy-forms>=2.4",
    "django-ninja>=1.4.3",
    "django-npm>=1.0.1",
    "django-oauth2-authcodeflow>=1.3.1",
    "django-pattern-library>=1.5.0",
    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.11.0",
    "whitenoise>=6.11.0",
    "pydantic[email]>=2.12.4",
    "pydantic_extra_types>=2.10.6",
    "phonenumbers>=9.0.20",
    "semver>=3.0.4",
    "weasyprint>=62.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",    
    "black>=25.9.0",
    "coverage>=7.10.7",
    "django-extensions>=3.2.3",
    "django-types>=0.22.0",
    "flake8>=7.3.0",
    "freezegun>=1.5.5",
    "isort>=6.1.0",
    "playwright>=1.49.0",
    "pre-commit>=4.0.0",
    "pydotplus>=2.0.2",
    "pyright[nodejs]>=1.1.406",
    "pytest-django>=4.11.1",
    "pytest-playwright>=0.6.2",
    "types-requests>=2.32.4.20250913",
    "ipdb",
    "pytest",
    "pytest-django",
    "django-stubs==5.2.8",
    "django-stubs-ext==5.2.8",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pyright]
venvPath = "."
venv = ".venv"
color_output = true
error_summary = true
namespace_packages = true
pretty = true
show_column_numbers = true
show_error_context = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "csfeer.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--nomigrations",
    "--reuse-db",  # Reuse test database between runs (faster)
    "-p no:warnings",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.setuptools]
py-modules = []

