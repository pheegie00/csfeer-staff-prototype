<div class="usa-card {{ additional_classes }}">
  <div class="usa-card__container">
    {% if title %}
    <div class="usa-card__header">
      <h4 class="usa-card__heading">{{ title }}</h4>
    </div>
    {% endif %}
    <div class="usa-card__body">
      {{ slot }}
    </div>
    {% if footer_content %}
    <div class="usa-card__footer">
      {{ footer_content }}
    </div>
    {% endif %}
  </div>
</div>
