{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CORE - Community Outcomes Reporting Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --acf-navy: #0b3b5c;
      --acf-blue: #2563eb;
      --acf-blue-hover: #1d4ed8;
      --acf-text: #1f2937;
      --acf-text-muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Public Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--acf-text);
      background: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* US gov banner */
    .usgov-stripe {
      background: #f0f0f0;
      padding: 6px 24px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .usgov-stripe__flag {
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7410 3900'><rect width='7410' height='3900' fill='%23b22234'/><path d='M0,450H7410M0,750H7410M0,1050H7410M0,1350H7410M0,1650H7410M0,1950H7410M0,2250H7410M0,2550H7410M0,2850H7410M0,3150H7410M0,3450H7410M0,3750H7410' stroke='white' stroke-width='300'/><rect width='2964' height='2100' fill='%233c3b6e'/></svg>") no-repeat center / contain;
      width: 16px; height: 12px;
      text-indent: -9999px;
      overflow: hidden;
    }
    .usgov-stripe a { color: #1d4ed8; }

    /* Header (matches the same navy treatment as the staff app pages) */
    .header {
      background: var(--acf-navy);
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header__title { font: 800 28px/1 "Public Sans", sans-serif; letter-spacing: 0.02em; margin-bottom: 4px; }
    .header__subtitle { font: 400 13px "Public Sans", sans-serif; opacity: 0.85; }
    .header__sign-in {
      background: #fff; color: var(--acf-navy);
      padding: 10px 22px; border-radius: 4px;
      font: 600 14px "Public Sans", sans-serif;
      text-decoration: none;
      transition: background 0.12s ease;
    }
    .header__sign-in:hover { background: #e5e7eb; }

    /* Centered sign-in body */
    .body {
      flex: 1 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 32px;
    }
    .body__inner { text-align: center; max-width: 480px; }
    .body__title {
      font: 700 28px/1.2 "Public Sans", sans-serif;
      color: var(--acf-text);
      margin: 0 0 12px;
    }
    .body__sub {
      font: 400 15px/1.5 "Public Sans", sans-serif;
      color: var(--acf-text-muted);
      margin: 0 0 28px;
    }
    .body__cta {
      display: inline-block;
      background: var(--acf-blue); color: #fff;
      padding: 12px 28px;
      border-radius: 4px;
      font: 600 14px "Public Sans", sans-serif;
      text-decoration: none;
      transition: background 0.12s ease;
    }
    .body__cta:hover { background: var(--acf-blue-hover); }

    /* Footer */
    .footer {
      background: var(--acf-navy);
      color: #fff;
      padding: 32px;
    }
    .footer__inner { max-width: 1100px; margin: 0 auto; }
    .footer__wordmark { font: 800 22px "Public Sans", sans-serif; letter-spacing: 0.02em; line-height: 1.2; }
    .footer__top { font-size: 11px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.08em; }
    .footer__amp { font-family: "Caveat", cursive; font-style: italic; font-weight: 400; opacity: 0.95; padding: 0 2px; }
  </style>
</head>
<body>

<div class="usgov-stripe">
  <div class="usgov-stripe__flag" aria-hidden="true">US</div>
  <span>An official website of the United States government</span>
  <a href="#" style="margin-left:6px;">Here's how you know</a>
</div>

<header class="header">
  <div>
    <div class="header__title">CORE</div>
    <div class="header__subtitle">ACF &middot; Community Outcomes Reporting Engine</div>
  </div>
  <a href="/oidc/authenticate?next=/staff/&fail=/login-error/" class="header__sign-in">Sign in</a>
</header>

<main class="body">
  <div class="body__inner">
    <h1 class="body__title">Welcome to CORE</h1>
    <p class="body__sub">Sign in to continue.</p>
    <a href="/oidc/authenticate?next=/staff/&fail=/login-error/" class="body__cta">Sign in</a>
  </div>
</main>

<footer class="footer">
  <div class="footer__inner">
    <div class="footer__wordmark">
      <div class="footer__top">Administration for</div>
      <div>CHILDREN <span class="footer__amp">&amp;</span> FAMILIES</div>
    </div>
  </div>
</footer>

</body>
</html>
