name: File Input
context:
  variants:            
    - title: "File Input"
      label: "Input accepts a single file"
      input_type: "single"
      accept: ""
      multiple: "false"
      hint: ""
    - title: "File Input (disabled)"
      label: "Input accepts a single file"
      input_type: "single"
      accept: ""
      multiple: "false"
      hint: ""
      disabled: "true"
    - title: "File Input (specific types)"
      label: "Input accepts only specific file types"
      input_type: "specific"
      accept: ".pdf,.txt"
      multiple: "true"
      hint: "Select PDF or TXT files"
    - title: "File Input (images only)"
      label: "Input accepts any kind of image"
      input_type: "wildcard"
      accept: "image/*"
      multiple: "true"
      hint: "Select any type of image format"
    - title: "File Input (multiple files of any kind)"
      label: "Input accepts multiple files"
      input_type: "multiple"
      accept: ""
      multiple: "true"
      hint: "Select one or more files"
    - title: "File Input (error)"
      label: "Input has an error"
      input_type: "error"
      accept: ""
      multiple: "false"
      hint: "Select any valid file"
      error_message: "Display a helpful error message"
