<c-vars
    id=""
    options=""
    default_option=""
    default_value=""
    disabled=""
    required=""
    name=""
/>

<select class="usa-select {{ extra_classes }}" {% if required %}required{% endif %} {% if disabled %}disabled{% endif %} name="{{ name }}" id="{{ id }}">
    {% if default_option %}
        <option selected value="{{ default_value }}">{{ default_option }}</option>
    {% endif %}
    {% for option in options %}
        <option value="{{ option.value }}">{{ option.display }}</option>
    {% endfor %}
</select>
