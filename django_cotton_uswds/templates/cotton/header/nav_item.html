<c-vars
    href=""
    text=""
    is_current="false"
    type="link"
    submenu_id=""
/>

<li class="usa-nav__primary-item">
    {% if type == 'dropdown' %}
        <button
            type="button"
            class="usa-accordion__button usa-nav__link{% if is_current == 'true' %} usa-current{% endif %}"
            aria-expanded="false"
            aria-controls="{{ submenu_id }}"
        >
            <span>{{ text }}</span>
        </button>
        {{ slot }}
    {% else %}
        <a href="{{ href }}" class="usa-nav-link{% if is_current == 'true' %} usa-current{% endif %}">
            <span>{{ text }}</span>
        </a>
    {% endif %}
</li>
