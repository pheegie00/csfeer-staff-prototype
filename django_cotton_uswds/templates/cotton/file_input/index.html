<c-vars
    file_type=""
    name=""
    accept=""
    multiple=""
    disabled=""
/>

<input
  id="file-input-{{ file_type }}"
  class="usa-file-input"
  type="file"
  name="{{ name }}"
  aria-describedby="file-input-{{ file_type }}-hint"
  accept="{{ accept }}"
  multiple="{$ if multiple == 'true' $}multiple{$ endif $}"
  {% if disabled %}disabled{% endif %}
/>
