{% load static %}

<c-vars
    href=""
    text=""
    variant=""
    is_current=""
    is_inverse=""
    is_external=""
/>

<a href="{{ href }}"{% if variant or is_inverse or is_external %} class="{% if variant == 'nav' %}usa-nav__link{% elif variant == 'summary-box' %}usa-summary-box__link{% elif variant == 'footer-primary' %}usa-footer__primary-link{% elif variant == 'default' %}usa-link{% elif is_inverse %}usa-link--inverse{% elif is_external %}usa-link--external{% endif %}{% if is_current == 'true' %} usa-current{% endif %}"{% endif %}{% if target %} target="{{ target }}"{% endif %}{% if rel %} rel="{{ rel }}"{% endif %} {{ attrs }}>
  {{ text }}
  {% if is_external %}
    <svg class="usa-icon" aria-hidden="true" role="img">
      <use xlink:href="{% static 'frontend/external-link.svg' %}"></use>
    </svg>
  {% endif %}
</a>
