<c-vars
    error=""
    success=""
    disabled=""
    readonly=""
    required=""
    hint=""
    extra_classes=""
    input_classes=""
    label_classes=""
/>

{% if error %}<div class="usa-form-group usa-form-group--error {{ extra_classes }}"{% else %}<div class="usa-form-group {{ extra_classes }}"{% endif %}>
  
  {# Label #}
  <label class="usa-label{% if error %} usa-label--error{% endif %} {{ label_classes }}" for="{{ id }}">
    {{ label|safe }}
  </label>
  
  {# Optional hint text #}
  {% if hint %}
    <div class="usa-hint" id="{{ id }}-hint">{{ hint|safe }}</div>
  {% endif %}
  
  {# Error message #}
  {% if error %}
    <span class="usa-error-message" id="{{ id }}-error-message" role="alert">{{ error|safe }}</span>
  {% endif %}
  
  {# Text input field #}
  <input
    class="usa-input {{ input_classes }}{% if width %} usa-input--{{ width }}{% endif %}{% if error %} usa-input--error{% endif %}{% if success %} usa-input--success{% endif %}"
    {{ attrs }}
    {% if disabled %}disabled{% endif %}
    {% if readonly %}readonly{% endif %}
    {% if required %}required{% endif %}
    {% if error %}aria-describedby="{{ id }}-error-message{% if hint %} {{ id }}-hint{% endif %}"{% elif hint %}aria-describedby="{{ id }}-hint"{% endif %}
  />
  
</div>
