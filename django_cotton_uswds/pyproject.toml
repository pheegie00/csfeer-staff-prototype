[project]
name = "django-cotton-uswds"
version = "0.0.0"
description = "USWDS-styled django-cotton components packaged as a Django app."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=3.2",
    "django-cotton>=0.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
