container_scanning:
  stage: security-scan
  image:
    name: registry.management.acf.gov/ngsc-oci/security/trivy:0.52.0
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
    TRIVY_CACHE_DIR: ".trivycache/"
  before_script:
    - apk add --no-cache jq  
  script:
    - trivy image --download-db-only --db-repository registry.management.acf.gov/ngsc-oci/security/trivy/trivy-db:2
    - trivy image --scanners vuln --vuln-type os --ignore-status affected,will_not_fix --format template --template "@/contrib/gitlab.tpl" -o gl-container-scanning-report.json $FULL_IMAGE_NAME
    - |
      # Count vulnerabilities by severity
      CRITICAL_COUNT=$(jq '[.vulnerabilities[] | select(.severity=="Critical")] | length' gl-container-scanning-report.json)
      HIGH_COUNT=$(jq '[.vulnerabilities[] | select(.severity=="High")] | length' gl-container-scanning-report.json)
      MEDIUM_COUNT=$(jq '[.vulnerabilities[] | select(.severity=="Medium")] | length' gl-container-scanning-report.json)
      LOW_COUNT=$(jq '[.vulnerabilities[] | select(.severity=="Low")] | length' gl-container-scanning-report.json)
      
      SCANNER_NAME=$(jq -r '.scan.analyzer.name' gl-container-scanning-report.json)
      SCANNER_VERSION=$(jq -r '.scan.analyzer.version' gl-container-scanning-report.json)
      
      if [ "$CRITICAL_COUNT" -eq 0 ]; then
        SCAN_STATUS="passed"
      else
        SCAN_STATUS="failed"
      fi
      
      echo "SECURITY_SCANNER=${SCANNER_NAME}" >> security.env
      echo "SECURITY_SCANNER_VERSION=${SCANNER_VERSION}" >> security.env
      echo "SECURITY_SCAN_STATUS=${SCAN_STATUS}" >> security.env
      echo "SECURITY_CRITICAL=${CRITICAL_COUNT}" >> security.env
      echo "SECURITY_HIGH=${HIGH_COUNT}" >> security.env
      echo "SECURITY_MEDIUM=${MEDIUM_COUNT}" >> security.env
      echo "SECURITY_LOW=${LOW_COUNT}" >> security.env
      cat security.env
  cache:
    paths:
      - .trivycache/
  allow_failure: false
  artifacts:
    when: always     
    reports:
      container_scanning: gl-container-scanning-report.json
      dotenv: security.env
    paths: 
      - gl-container-scanning-report.json 
  needs:
   - Build image and push to registry
   - prepare


