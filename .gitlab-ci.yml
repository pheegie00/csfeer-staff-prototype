
default:
  tags: 
    - live-csfeer-development

variables:
  SECURE_ANALYZERS_PREFIX: "$CI_TEMPLATE_REGISTRY_HOST/security-products"
  DS_EXCLUDED_ANALYZERS: ""
  DS_EXCLUDED_PATHS: "spec, test, tests, tmp"
  DS_MAJOR_VERSION: 4
  DS_SCHEMA_MODEL: 15
  BUMP_VERSION:
    value: ""
    description: "Version to bump to (e.g. v1.2.3)"
  #appliction variables 
  DOCKERFILE: Dockerfile
  
  # security variables
  SONAR_PROJECT_NAME: "csfeer-$CI_PROJECT_NAME"

  SONAR_EXCLUSIONS: "Dockerfile, **/*/*.yml, **/*/*.yaml,**/*.java"
  DAST_SCAN_ENABLED: "false"
  # hashicorp vault integration
  VAULT_SERVER_URL: https://vault.security.acf.gov
  VAULT_AUTH_PATH: csfeer
  VAULT_AUTH_ROLE: gitlab
  VAULT_ADDR: "$VAULT_SERVER_URL"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        FULL_IMAGE_NAME: $CI_REGISTRY/$CI_PROJECT_PATH:mr-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME-$CI_PIPELINE_ID
        ENVIRONMENT: development
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null
      variables:
        FULL_IMAGE_NAME: $CI_REGISTRY/$CI_PROJECT_PATH:rc-$VERSION-$CI_PIPELINE_ID
        ENVIRONMENT: test


stages:
  - prepare
  - extract
  - security-test
  - build
  - run-tests
  - content:dev
  - build
  - security-scan
  - deploy:dev
  - deploy:test
  - UAT
  - release
  - publish

prepare:
  stage: prepare
  image: 
    name: registry.access.redhat.com/ubi9-minimal:latest

  variables:
    GIT_DEPTH: 0 
  before_script: 
    - microdnf install -y git
    - git config --global --add safe.directory '*'
  script:

    - export LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1 )
    - if [ -z "${LATEST_TAG}" ]; then  export LATEST_TAG="v0.0.0" ; fi
    - echo "latest tag:$LATEST_TAG" # debug
    # Strip the "v" prefix to get "1.4.0"
    - export CURRENT_VERSION=${LATEST_TAG#v}
    - echo $CURRENT_VERSION #debug
    - export MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
    - export MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
    - export PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
    - |
      if [[ -n "$BUMP_VERSION" ]]; then
        export NEXT_VERSION=$BUMP_VERSION;
        echo "Manual override detected: Bumping version to $NEXT_VERSION";
      else
        export NEXT_VERSION="$MAJOR.$(($MINOR + 1)).0";
        echo "Automatically bumping version to $NEXT_VERSION";
      fi
    - echo VERSION=${NEXT_VERSION} >> build.env
    - echo "Next release version - $NEXT_VERSION"
  artifacts:
    reports:
      dotenv: build.env



