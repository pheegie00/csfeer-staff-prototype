# ------------ Extract compiled outputs from the built image ------------
# Set SOURCE_IMAGE if the builder uses a different tag or another registry
extract:binaries:
#  needs: ["build"]
  stage: extract
  image: docker:27
  services:
    - name: docker:27-dind
  variables:
    DOCKER_BUILDKIT: "1"
    # Default: image built in this project, tagged by commit SHA
    SOURCE_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    # Optional override creds if pulling from another project/registry
    REGISTRY_USER: $CI_REGISTRY_USER
    REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
    REGISTRY_HOST: $CI_REGISTRY
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY" || true
  script: |
    set -euo pipefail
    echo "Pulling $SOURCE_IMAGE"
    docker pull "$SOURCE_IMAGE"

    # Create a temp container and copy likely build outputs out
    cid=$(docker create "$SOURCE_IMAGE")
    mkdir -p sonar_payload

    # Known Gradle/Maven locations; copy what exists
    for p in \
      /src/build \
      /workspace/build \
      /project/build \
      /app/build \
      /src/target \
      /workspace/target \
      /project/target \
      /app/target
    do
      docker cp "$cid":"$p" sonar_payload/ 2>/dev/null && echo "Copied $p" || true
    done

    # Fallback: discover .class trees and copy their parent dirs (limited)
    docker start "$cid" >/dev/null
    docker exec "$cid" sh -lc '
      set -e
      for d in /src /workspace /project /app /home/gradle; do
        [ -d "$d" ] && find "$d" -type f -name "*.class" -printf "%h\n" || true
      done | sort -u | head -n 50
    ' > dirs.txt || true

    while read -r d; do
      [ -n "$d" ] || continue
      safe="classes$(echo "$d" | tr "/ " "__")"
      docker cp "$cid":"$d" "sonar_payload/$safe" 2>/dev/null || true
    done < dirs.txt

    docker rm -v "$cid"

    # Derive paths for Sonar
    BIN_DIRS=$(find sonar_payload -type d -path "*/classes*" | paste -sd, - || true)
    [ -z "$BIN_DIRS" ] && BIN_DIRS=$(find sonar_payload -type d -path "*/build/classes/*/main" | paste -sd, - || true)
    JUNIT_DIR=$(find sonar_payload -type d -path "*/test-results/test" | head -n1 || true)
    JACOCO_XML=$(find sonar_payload -type f \( -name "jacocoTestReport.xml" -o -name "jacoco.xml" \) | head -n1 || true)

    {
      echo "SONAR_BINARIES=${BIN_DIRS}"
      echo "SONAR_JUNIT=${JUNIT_DIR}"
      echo "SONAR_JACOCO=${JACOCO_XML}"
    } > sonar_payload/paths.env

    echo "Discovered binaries: ${BIN_DIRS:-none}"
    echo "JUnit reports: ${JUNIT_DIR:-none}"
    echo "Jacoco XML: ${JACOCO_XML:-none}"
  artifacts:
    name: "sonar-payload-$CI_COMMIT_REF_SLUG"
    expire_in: 1 days
    when: always
    paths:
      - sonar_payload/
  allow_failure: true
  rules:
    - if: $ENABLE_SONAR == "false"
      when: never
    - if: $CI_COMMIT_BRANCH == 'main' || $CI_COMMIT_BRANCH == 'master' || $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_TAG == null

SAST:
  stage: security-test
  image: 
    name: registry.management.acf.gov/ngsc-oci/security/sonarqube:0.1
    entrypoint: [""]
  needs:  ["extract:binaries"]
  variables:
    SONAR_HOST_URL: https://sonarqube.management.acf.gov
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache

  script: |
    set -euo pipefail
    [ -f sonar_payload/paths.env ] && source sonar_payload/paths.env || true 
    # Fall back if nothing was discovered
    SONAR_BINARIES="${SONAR_BINARIES:-build/classes/java/main}"
    # Build arg list
    args=(
      -Dsonar.projectKey="$SONAR_PROJECT_NAME"
      -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
      -Dsonar.qualitygate.wait=true
      -Dsonar.python.coverage.reportPaths=python/coverage.xml
      -Dsonar.sources=./*
      -Dsonar.tests=src
      -Dsonar.exclusions=**/build/**,**/target/**,**/.gradle/**
      -Dsonar.java.binaries="$SONAR_BINARIES"
      -Dsonar.exclusions="$SONAR_EXCLUSIONS
    sonar-scanner "${args[@]}"
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == 'main' || $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: always
    - when: never

Vulnerability-Report:
  stage: security-test
  image: curlimages/curl:latest
  needs:
    - job: SAST
      artifacts: false
  script:
    - 'curl -u "${SONAR_TOKEN}:" "https://sonarqube.management.acf.gov/api/issues/gitlab_sast_export?projectKey=$SONAR_PROJECT_NAME&branch=${CI_COMMIT_BRANCH}&pullRequest=${CI_MERGE_REQUEST_IID}" -o gl-sast-sonar-report.json'  # Replace <projectKey> with your project key
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == 'main' || $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: always
    - when: never

  artifacts:
    expire_in: 3 day
    reports:
      sast: gl-sast-sonar-report.json
    paths: 
    - gl-sast-sonar-report.json

dependency_scanning:
  stage: security-test
  script:
    - echo "$CI_JOB_NAME is used for configuration only, and its script should not be executed"
    - exit 1
  artifacts:
    when: always
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    paths: 
    - gl-dependency-scanning-report.json
  dependencies: []
  retry: 2
  rules:
    - when: never

.ds-analyzer:
  extends: dependency_scanning
  allow_failure: true
  variables:
    # DS_ANALYZER_IMAGE is an undocumented variable used internally to allow QA to
    # override the analyzer image with a custom value. This may be subject to change or
    # breakage across GitLab releases.
    DS_ANALYZER_IMAGE: "$SECURE_ANALYZERS_PREFIX/$DS_ANALYZER_NAME:$DS_MAJOR_VERSION"
    # DS_ANALYZER_NAME is an undocumented variable used in job definitions
    # to inject the analyzer name in the image name.
    DS_ANALYZER_NAME: ""
  image:
    name: "$DS_ANALYZER_IMAGE$DS_IMAGE_SUFFIX"
  # `rules` must be overridden explicitly by each child job
  # see https://gitlab.com/gitlab-org/gitlab/-/issues/218444
  script:
    - /analyzer run

.cyclonedx-reports:
  artifacts:
    paths:
      - "**/gl-sbom-*.cdx.json"
    reports:
      cyclonedx: "**/gl-sbom-*.cdx.json"

.gemnasium-shared-rule:
  exists:
    - '**/{Gemfile.lock,composer.lock,gems.locked,go.sum,npm-shrinkwrap.json,package-lock.json,yarn.lock,pnpm-lock.yaml,packages.lock.json,conan.lock}'

gemnasium-dependency_scanning:
  extends:
    - .ds-analyzer
    - .cyclonedx-reports
  variables:
    DS_ANALYZER_NAME: "gemnasium"
    GEMNASIUM_LIBRARY_SCAN_ENABLED: "true"
    DS_MAX_DEPTH: -1 # NO LIMIT.  Some projects have a deep directory structure.
  needs: []
  rules:
    - if: $DEPENDENCY_SCANNING_DISABLED == 'true' || $DEPENDENCY_SCANNING_DISABLED == '1'
      when: never
    - if: $DS_EXCLUDED_ANALYZERS =~ /gemnasium([^-]|$)/
      when: never
    - if: $CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"   
      exists: !reference [.gemnasium-shared-rule, exists]
      variables:
        DS_IMAGE_SUFFIX: "-fips"
        DS_REMEDIATE: "false"
    - if: $CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"   
      exists: !reference [.gemnasium-shared-rule, exists]
  artifacts:
    when: always
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    paths: 
    - gl-dependency-scanning-report.json
    
.gemnasium-maven-shared-rule:
  exists:
    - '**/{build.gradle,build.gradle.kts,build.sbt,pom.xml}'

gemnasium-maven-dependency_scanning:
  extends:
    - .ds-analyzer
    - .cyclonedx-reports
  variables:
    DS_ANALYZER_NAME: "gemnasium-maven"
  artifacts:
    when: always
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    paths: 
    - gl-dependency-scanning-report.json
  needs: []
  rules:
    - if: $DEPENDENCY_SCANNING_DISABLED == 'true' || $DEPENDENCY_SCANNING_DISABLED == '1'
      when: never
    - if: $DS_EXCLUDED_ANALYZERS =~ /gemnasium-maven/
      when: never
    - if: $CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"   
      exists: !reference [.gemnasium-maven-shared-rule, exists]
      variables:
        DS_IMAGE_SUFFIX: "-fips"
    - if: $CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"   
      exists: !reference [.gemnasium-maven-shared-rule, exists]

.gemnasium-python-shared-rule:
  exists:
    - '**/{requirements.txt,requirements.pip,Pipfile,Pipfile.lock,requires.txt,setup.py,poetry.lock}'

gemnasium-python-dependency_scanning:
  extends:
    - .ds-analyzer
    - .cyclonedx-reports
  variables:
    DS_ANALYZER_NAME: "gemnasium-python"
  artifacts:
    when: always
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    paths: 
    - gl-dependency-scanning-report.json
  needs: []
  rules:
    - if: $DEPENDENCY_SCANNING_DISABLED == 'true' || $DEPENDENCY_SCANNING_DISABLED == '1'
      when: never
    - if: $DS_EXCLUDED_ANALYZERS =~ /gemnasium-python/
      when: never
  #  - if: $CI_PIPELINE_SOURCE == "merge_request_event" 
    - if: $CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"   
      exists: !reference [.gemnasium-python-shared-rule, exists]
      variables:
        DS_IMAGE_SUFFIX: "-fips"
    - if: $CI_COMMIT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"   
      exists: !reference [.gemnasium-python-shared-rule, exists]
    # Support passing of $PIP_REQUIREMENTS_FILE
    # See https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#configuring-specific-analyzers-used-by-dependency-scanning
    - if: $CI_COMMIT_BRANCH &&
          $GITLAB_FEATURES =~ /\bdependency_scanning\b/ &&
          $PIP_REQUIREMENTS_FILE &&
          $CI_GITLAB_FIPS_MODE == "true"
      variables:
        DS_IMAGE_SUFFIX: "-fips"
    - if: $CI_COMMIT_BRANCH &&
          $GITLAB_FEATURES =~ /\bdependency_scanning\b/ &&
          $PIP_REQUIREMENTS_FILE
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null    

release:
  image: 
    name: registry.management.acf.gov/ngsc-oci/security/cosign-vault:0.1.6
  stage: release
  needs:
    - prepare
    - container_scanning
  variables: 
    RC_IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH:rc-$VERSION-$CI_PIPELINE_ID
    VAULT_ADDR: https://vault.security.acf.gov
    SYSTEM_NAME: rads
    COSIGN_ANNOTATION_security_passed: "true"
    COSIGN_ANNOTATION_build_source: "gitlab"
    COSIGN_ANNOTATION_environment: "production"
    COSIGN_ANNOTATION_commit_sha: "${CI_COMMIT_SHA}"
    COSIGN_ANNOTATION_pipeline_id: "${CI_PIPELINE_ID}"
    MATERIAL_GIT_REPO: "${CI_PROJECT_URL}"
    MATERIAL_DOCKERFILE: "${CI_PROJECT_URL}/-/blob/${CI_COMMIT_SHA}/$DOCKERFILE"
    IMAGE_NAME: $CI_REGISTRY/$CI_PROJECT_PATH:$VERSION
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.security.acf.gov               
  script: 
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - export STORAGE_DRIVER=vfs
    - buildah pull $RC_IMAGE
    - buildah tag $RC_IMAGE $IMAGE_NAME
    - buildah push $IMAGE_NAME
    - export CI_JOB_JWT="$VAULT_ID_TOKEN"
    - echo "$CI_REGISTRY_PASSWORD" | cosign login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - sign-image
    - create-attestation


  artifacts:
    paths:
      - attestation-data.json
      - security-attestation-report.md  
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null
      when: manual

Package Release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  environment: release
  needs: 
    - prepare
    - release
  script:
    - echo "Running the release job."
  release:
    tag_name: v$VERSION
    name: 'Release RADS Estimator Backend $VERSION'
    description: 'Release for RADS Estimator Backend'
    assets:
      links:
        - name: "rads-estimator-backend-image"
          url: "https://${CI_REGISTRY_IMAGE}:${VERSION}"
          link_type: "image"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == null
      when: manual


