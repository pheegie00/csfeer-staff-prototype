{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="grid-container">
  <div class="grid-row">
    <div class="grid-col-12">
      {% include "form_manager/_form_header.html" %}
    </div>
  </div>
  <div class="grid-row grid-gap-4">
    <div class="grid-col-12 desktop:grid-col-3">
      {% include "form_manager/_side_nav.html" %}
    </div>
    <div class="grid-col-12 desktop:grid-col-9">
      <c-form id="csf-form" class="" method="post" action="{{ next_url }}" enctype="multipart/form-data" x-data="" novalidate @change="updateCalculatedFields">
        {% csrf_token %}
        <input type="hidden" name="redirect_to" id="nav-redirect-to" value="">
        {{ current_page }}
      </c-form>

      {% include "form_manager/_quick_actions.html" %}
    </div>
  </div>
</div>

<script>
  // Initialize USWDS date pickers
  document.addEventListener('DOMContentLoaded', function() {
    const datePickers = document.querySelectorAll('.usa-date-picker');
    datePickers.forEach(function(picker) {
      // USWDS date picker will auto-initialize
    });
  });

  // Side nav navigation: save current page before navigating
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('csf-form');
    const redirectInput = document.getElementById('nav-redirect-to');

    document.querySelectorAll('.usa-sidenav a').forEach(function(link) {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        redirectInput.value = this.getAttribute('href');
        form.action = window.location.pathname + window.location.search;
        form.submit();
      });
    });
  });
</script>
{% endblock %}
