<h1 class="font-heading-2xl semibold font-family-sans font-weight-semibold">{{ title }}</h1>

{% if subtitle %}
<p class="font-body-sm">{{ subtitle }}</p>
{% endif %}

<c-fieldset class="usa-fieldset usa-form usa-form--large">
    {% for child in children %}
        {{ child.render }}
    {% endfor %}
</c-fieldset>

<div class="margin-top-4 padding-top-2 border-top-1px border-base-lighter">
    <div class="display-flex flex-justify flex-wrap flex-gap-1 flex-align-end">

        {% if current_step_number != 0 or current_page_number != 0 %}
        <a href="{{ prev_url }}" class="usa-button usa-button--outline" type="submit" name="page-action" value="previous">
        ← Back
        </a>
        {% endif %}
        
        <c-button 
            text="{% if is_last_page %}Save & Begin Final Review →{% else %}Save & Continue →{% endif %}"
            variant="base"
            state="active"
            type="submit"
        />
    </div>
</div>
