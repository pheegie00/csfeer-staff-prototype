<div class="font-family-body text-semibold margin-bottom-05">{{ component.display_title }}</div>
<div class="{% if component.errors %}text-error{% endif %} font-family-body margin-bottom-3">
    {% for choice in component.field.field.fields.0.choices %}
        {% if component.value.0 == choice.0 %}{{ choice.1 }}{% endif %}
    {% endfor %}
</div>

{% if component.value.0 == "yes" %}
    {% for sub_block in component.sub_review_blocks %}
        {{ sub_block }}
    {% endfor %}
{% endif %}
