<div class="font-family-body text-semibold margin-bottom-05">
    {% block item_title %}{{ component.display_title }}{% endblock %}
</div>

<div class="{% if component.errors %}text-error{% endif %} font-family-body">

{% if component.errors %}
    {{ component.errors.0 }}
{% else %}
    {% block component_value %}{{ component.value }}{% endblock %}
{% endif %}

</div>
