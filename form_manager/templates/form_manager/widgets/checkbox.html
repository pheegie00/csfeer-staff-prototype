<input type="hidden" name="{{ widget.name }}_submitted" value="1">
<c-checkbox
    id="{{ widget.attrs.id }}"
    name="{{ widget.name }}"
    label="{{ widget.label }}"
    checked="{% if widget.attrs.checked %}checked{% endif %}"
    required="{% if widget.attrs.required %}required{% endif %}"
    disabled="{% if widget.attrs.disabled %}disabled{% endif %}"
/>
