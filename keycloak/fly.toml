# Keycloak deploy on Fly.io for the CORE prototype.
#
# - Separate app from the Django one (acf-core).
# - 1GB RAM machine because Keycloak's JVM is hungry; 256MB OOMs on boot.
# - Auto-stop when idle. First request after 5 min cold takes 10-20s
#   while the JVM warms back up. Acceptable for a demo.
# - HTTP on port 8080 inside, HTTPS at the edge via Fly.

app = "acf-core-keycloak"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  KC_HEALTH_ENABLED = "true"
  KC_HTTP_ENABLED = "true"
  KC_HOSTNAME_STRICT = "false"
  KC_HOSTNAME_STRICT_HTTPS = "false"
  KC_PROXY_HEADERS = "xforwarded"
  # Once the app boots and the realm is imported, you can browse
  # the admin UI at https://acf-core-keycloak.fly.dev/admin/
  KC_HOSTNAME = "acf-core-keycloak.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # Keycloak takes 2-3 minutes to boot. If we let Fly auto-stop on
  # idle, it kills the JVM right after it starts (no traffic in the
  # warm window) and we ping-pong forever. Keep at least 1 machine
  # running always.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # 1GB was too tight; Quarkus augmentation OOM'd before listen.
  # 2GB gives Keycloak headroom to boot + serve the realm.
  memory_mb = 2048

# No persistent volume on purpose. We import the realm fresh from the
# baked-in JSON on every boot, which keeps the demo state reproducible.
# Adding a [mounts] block at /opt/keycloak/data shadows the import dir
# (the volume is empty on first boot, so the bake-in disappears).
