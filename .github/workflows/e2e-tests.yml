name: E2E Tests

on:
  workflow_dispatch:
  # Uncomment to enable automatic runs:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync

      - name: Install Playwright browsers
        run: |
          uv run playwright install chromium --with-deps

      - name: Add hosts entries
        run: |
          echo "127.0.0.1 oauth.csfeer" | sudo tee -a /etc/hosts
          echo "127.0.0.1 ui.csfeer" | sudo tee -a /etc/hosts

      - name: Start Docker services
        run: |
          docker compose up -d
          docker compose ps

      - name: Wait for services to be ready
        run: |
          timeout 60 bash -c 'until docker compose exec -T db pg_isready -U csfeer; do sleep 2; done'
          timeout 60 bash -c 'until curl -f http://oauth.csfeer:8081 > /dev/null 2>&1; do sleep 2; done'
          sleep 10

      - name: Run migrations
        run: |
          docker compose exec -T web uv run python manage.py migrate

      - name: Setup OAuth
        run: |
          docker compose run --rm oauth-setup

      - name: Run e2e tests
        run: |
          uv run pytest tests/e2e/ -v -m e2e --maxfail=5
        env:
          BASE_URL: http://ui.csfeer:8000

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            tests/screenshots/
            tests/videos/
            tests/traces/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Docker logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Cleanup
        if: always()
        run: |
          docker compose down --volumes
