name: Pre-commit Checks

on:
  workflow_dispatch:
  # Uncomment to enable automatic runs:
  # pull_request:
  #   branches: [ main ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Install dependencies
      run: uv sync --dev

    - name: Run pre-commit
      run: |
        uv run pre-commit run black --all-files --show-diff-on-failure
        uv run pre-commit run isort --all-files --show-diff-on-failure
        uv run pre-commit run pyright --all-files --show-diff-on-failure