name: Pre-commit Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

env:
  ACTIONS_RUNNER_DEBUG: true
  ACTIONS_STEP_DEBUG: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install graphviz -y
        uv sync --dev

    - name: Run pre-commit
      run: |
        uv run pre-commit install
        uv run pre-commit run black --all-files --show-diff-on-failure
        uv run pre-commit run ruff --all-files --show-diff-on-failure
        uv run pre-commit run pyright --all-files --show-diff-on-failure

